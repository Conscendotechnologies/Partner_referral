name: 002-partner-referral S03 State routing, urgent movers and first-contact SLA
context: 'Connectnow partner referral programme (feature 002) in the SDO org salesOrgSDO (a demo org, not a sandbox: every

  record a case creates starts with AI-TEST so it can be cleaned up).

  Partner portal: Experience Cloud site "Connectnow Partners" (https://co1778135180529.my.site.com/partners). Its home

  page holds the "Referrals this month" tiles, the commission tiles (principals only), the "Refer a mover" form and the

  referral tracker. Partner cases start as the admin and use "Log in to Experience as User" on the partner''s Contact.

  Internal app: "Connectnow Partner Referrals". Internal cases log in as a test user from Setup > Users.

  Personas:

  - Tom Nguyen: partner Agent, agency Harbour & Co Realty (Active).

  - Priya Shah: partner Principal, Harbour & Co Realty.

  - Chloe Tan: partner Agent, agency Bayside Property Group (Active).

  - Marco Rossi: partner Principal, Bayside Property Group.

  - Sam Rep (PR test): sales rep (PR_Sales_Rep), member of queues PR_NSW_ACT and PR_VIC_TAS.

  - Maya Manager (PR test): Partner Manager (PR_Partner_Manager + PR_Sales_Rep).

  - Fiona Finance (PR test): Finance (PR_Finance).

  Business terms: a referral (Referral__c, label "Referral") creates a Partner Referral Lead; converting it gives a

  Partner Referral Opportunity; at stage "Utilities Connected" a Partner Commission is created; Finance pays approved

  commissions monthly through a Payout Batch and the Xero CSV. Amounts are AUD ex GST.

  Assumptions (no story files in the repo; designed from the Jira acceptance criteria): UI labels were read from the

  org and the deployed components on 2026-11-18.

  '
cases:
- id: S03-TC-01
  title: A VIC Partner Referral Lead is routed to PR_VIC_TAS
  section: S03 State routing, urgent movers and first-contact SLA
  tags:
  - story-03
  - smoke
  steps:
  - Open the Leads tab
  - Click "New"
  - Select record type "Partner Referral" and click "Next"
  - Enter "AI-TEST Route VIC <unique suffix>" in "Last Name"
  - Enter "AI-TEST Co" in "Company" if the field is shown
  - Enter "VIC" in "State/Province" of the address
  - Enter a date 30 days from today in "Move-in Date"
  - Tick "Electricity" in "Utilities"
  - Click "Save"
  expected:
  - The Lead is saved
  - Lead Owner is the queue "PR_VIC_TAS"
- id: S03-TC-03
  title: A Lead with move-in inside 48 hours is urgent
  section: S03 State routing, urgent movers and first-contact SLA
  tags:
  - story-03
  - regression
  steps:
  - Open the Leads tab
  - Click "New"
  - Select record type "Partner Referral" and click "Next"
  - Enter "AI-TEST Urgent <unique suffix>" in "Last Name"
  - Enter "AI-TEST Co" in "Company" if the field is shown
  - Enter "NSW" in "State/Province" of the address
  - Enter tomorrow's date in "Move-in Date"
  - Tick "Electricity" in "Utilities"
  - Click "Save"
  expected:
  - The Lead is saved
  - '"Urgent" is ticked on the Lead'
  - Lead Owner is the queue "PR_NSW_ACT"
- id: S03-TC-08
  title: A new Lead shows SLA Due At
  section: S03 State routing, urgent movers and first-contact SLA
  tags:
  - story-03
  - regression
  steps:
  - Open the Leads tab
  - Click "New"
  - Select record type "Partner Referral" and click "Next"
  - Enter "AI-TEST SLA <unique suffix>" in "Last Name"
  - Enter "AI-TEST Co" in "Company" if the field is shown
  - Enter "QLD" in "State/Province" of the address
  - Enter a date 30 days from today in "Move-in Date"
  - Tick "Electricity" in "Utilities"
  - Click "Save"
  expected:
  - The Lead is saved
  - '"First Contact Due" has a date and time later than the creation time'
- id: S03-TC-09
  title: First move to Working stamps First Contacted At
  section: S03 State routing, urgent movers and first-contact SLA
  tags:
  - story-03
  - regression
  preconditions:
  - A Partner Referral Lead "AI-TEST SLA ..." from S03-TC-08 exists in a queue Sam can see, or create one with state NSW
  steps:
  - Open Setup > Users (/lightning/setup/ManageUsers/home)
  - Click "Login" next to the user "Sam Rep (PR test)"
  - Open the Leads tab
  - Select the "PR - NSW + ACT queue" list view
  - Open the newest "AI-TEST" Lead
  - Change Lead Status to "Working" and save
  expected:
  - '"First Contacted At" now shows the current date and time'
  - '"SLA Breached" is not ticked when that time is before "First Contact Due"'
- id: S03-TC-11
  title: A queue list view puts urgent Leads first, then by move-in date
  section: S03 State routing, urgent movers and first-contact SLA
  tags:
  - story-03
  - regression
  steps:
  - Open Setup > Users (/lightning/setup/ManageUsers/home)
  - Click "Login" next to the user "Sam Rep (PR test)"
  - Open the Leads tab
  - Select the "PR - NSW + ACT queue" list view
  expected:
  - All Leads with Urgent ticked appear above the non-urgent Leads
  - Within each group Leads are ordered by Move-in Date, earliest first
