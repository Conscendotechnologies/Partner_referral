name: 002-partner-referral S12 Page layouts and record pages
context: 'Connectnow partner referral programme (feature 002) in the SDO org salesOrgSDO (a demo org, not a sandbox: every

  record a case creates starts with AI-TEST so it can be cleaned up).

  Partner portal: Experience Cloud site "Connectnow Partners" (https://co1778135180529.my.site.com/partners). Its home

  page holds the "Referrals this month" tiles, the commission tiles (principals only), the "Refer a mover" form and the

  referral tracker. Partner cases start as the admin and use "Log in to Experience as User" on the partner''s Contact.

  Internal app: "Connectnow Partner Referrals". Internal cases log in as a test user from Setup > Users.

  Personas:

  - Tom Nguyen: partner Agent, agency Harbour & Co Realty (Active).

  - Priya Shah: partner Principal, Harbour & Co Realty.

  - Chloe Tan: partner Agent, agency Bayside Property Group (Active).

  - Marco Rossi: partner Principal, Bayside Property Group.

  - Sam Rep (PR test): sales rep (PR_Sales_Rep), member of queues PR_NSW_ACT and PR_VIC_TAS.

  - Maya Manager (PR test): Partner Manager (PR_Partner_Manager + PR_Sales_Rep).

  - Fiona Finance (PR test): Finance (PR_Finance).

  Business terms: a referral (Referral__c, label "Referral") creates a Partner Referral Lead; converting it gives a

  Partner Referral Opportunity; at stage "Utilities Connected" a Partner Commission is created; Finance pays approved

  commissions monthly through a Payout Batch and the Xero CSV. Amounts are AUD ex GST.

  Assumptions (no story files in the repo; designed from the Jira acceptance criteria): UI labels were read from the

  org and the deployed components on 2026-11-18.

  '
cases:
- id: S12-TC-01
  title: Referral page shows the mover, address, dates, services, consent, status, rep, agent, agency, Lead and Opportunity
    links and Commissions
  section: S12 Page layouts and record pages
  tags:
  - story-12
  - regression
  preconditions:
  - S02-TC-01 has run
  steps:
  - Open the Referrals tab
  - Search "Mover 0201" in the list search box and open the newest matching Referral
  expected:
  - The page shows mover name, mobile, new address, Move-in Date, Utilities, consent time and version, Status and Rep First
    Name
  - It shows Referring Agent, Referring Agency and the Lead and Opportunity links
  - A "Partner Commissions" related list is on the page
- id: S12-TC-02
  title: Commission page shows all its fields; Amount, Rate Applied and Services Count are read-only
  section: S12 Page layouts and record pages
  tags:
  - story-12
  - regression
  preconditions:
  - A Partner Commission exists
  steps:
  - Open Setup > Users (/lightning/setup/ManageUsers/home)
  - Click "Login" next to the user "Maya Manager (PR test)"
  - Open the Opportunities tab
  - Search "AI-TEST Commission" in the list search box and open the Opportunity
  - Open the commission from the "Partner Commissions" related list
  - Click "Edit"
  expected:
  - The page shows Agency, Opportunity, Referral, Rate Applied, Services Count, Amount, Status, Approved By, Approved On,
    Payout Line, Cancellation Reason and Reopened After Approval
  - In edit mode Amount, Rate Applied and Services Count cannot be edited
- id: S12-TC-03
  title: Payout Batch page shows its fields, Lines and the console for that batch only
  section: S12 Page layouts and record pages
  tags:
  - story-12
  - regression
  preconditions:
  - A Payout Batch exists
  steps:
  - Open Setup > Users (/lightning/setup/ManageUsers/home)
  - Click "Login" next to the user "Fiona Finance (PR test)"
  - Open the "Payouts" tab in the Connectnow Partner Referrals app
  - Click the month link of a batch
  expected:
  - The page shows Period Month, Status, Run Count, Total and Paid Date
  - A "Payout Lines" related list is shown
  - The "Commission payouts" console on the page lists only this batch and has no "Run payout" button
- id: S12-TC-04
  title: Payout Line page shows agency, ABN, reference, total, count and its Commissions
  section: S12 Page layouts and record pages
  tags:
  - story-12
  - regression
  preconditions:
  - A Payout Batch with lines exists
  steps:
  - Open Setup > Users (/lightning/setup/ManageUsers/home)
  - Click "Login" next to the user "Fiona Finance (PR test)"
  - Open the "Payouts" tab in the Connectnow Partner Referrals app
  - Click the month link of a batch
  - Open a line from the "Payout Lines" related list
  expected:
  - The line shows Agency, ABN, Payment Reference, Total ex GST and Commission Count
  - A "Partner Commissions" related list shows its commissions
- id: S12-TC-05
  title: Partner Referral Lead and Opportunity layouts show the partner referral fields
  section: S12 Page layouts and record pages
  tags:
  - story-12
  - regression
  steps:
  - Open Setup > Users (/lightning/setup/ManageUsers/home)
  - Click "Login" next to the user "Sam Rep (PR test)"
  - Open the Leads tab
  - Select the "PR - NSW + ACT" list view
  - Open the first Lead
  expected:
  - The page shows Referral, Referring Agency, Referring Agent, Move-in Date, Utilities, consent, Urgent, SLA Due At, First
    Contacted At and SLA Breached
- id: S12-TC-07
  title: Partner users still see only the portal components
  section: S12 Page layouts and record pages
  tags:
  - story-12
  - regression
  - security
  steps:
  - Open the Contacts tab
  - Search "Tom Nguyen" in the list search box and open the Contact "Tom Nguyen"
  - Click "Log in to Experience as User" (in the actions menu) and choose "Connectnow Partners" if asked
  - Look at the home page
  expected:
  - The portal shows the "Refer a mover" form, the tracker and the tiles; no internal Lead, Opportunity or commission record
    page is reachable from it
