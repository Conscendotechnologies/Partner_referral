name: 002-partner-referral S05 Lead conversion to a Partner Referral Opportunity with products
context: 'Connectnow partner referral programme (feature 002) in the SDO org salesOrgSDO (a demo org, not a sandbox: every

  record a case creates starts with AI-TEST so it can be cleaned up).

  Partner portal: Experience Cloud site "Connectnow Partners" (https://co1778135180529.my.site.com/partners). Its home

  page holds the "Referrals this month" tiles, the commission tiles (principals only), the "Refer a mover" form and the

  referral tracker. Partner cases start as the admin and use "Log in to Experience as User" on the partner''s Contact.

  Internal app: "Connectnow Partner Referrals". Internal cases log in as a test user from Setup > Users.

  Personas:

  - Tom Nguyen: partner Agent, agency Harbour & Co Realty (Active).

  - Priya Shah: partner Principal, Harbour & Co Realty.

  - Chloe Tan: partner Agent, agency Bayside Property Group (Active).

  - Marco Rossi: partner Principal, Bayside Property Group.

  - Sam Rep (PR test): sales rep (PR_Sales_Rep), member of queues PR_NSW_ACT and PR_VIC_TAS.

  - Maya Manager (PR test): Partner Manager (PR_Partner_Manager + PR_Sales_Rep).

  - Fiona Finance (PR test): Finance (PR_Finance).

  Business terms: a referral (Referral__c, label "Referral") creates a Partner Referral Lead; converting it gives a

  Partner Referral Opportunity; at stage "Utilities Connected" a Partner Commission is created; Finance pays approved

  commissions monthly through a Payout Batch and the Xero CSV. Amounts are AUD ex GST.

  Assumptions (no story files in the repo; designed from the Jira acceptance criteria): UI labels were read from the

  org and the deployed components on 2026-11-18.

  '
cases:
- id: S05-TC-01
  title: Converting a Partner Referral Lead creates a Person Account and a Partner Referral Opportunity at Qualification
  section: S05 Lead conversion to a Partner Referral Opportunity with products
  tags:
  - story-05
  - smoke
  mode: both
  preconditions:
  - A Partner Referral Lead "AI-TEST Convert ..." with Utilities Electricity and Internet, state NSW, no Company, owned by
    Sam Rep (PR test) exists
  steps:
  - Open Setup > Users (/lightning/setup/ManageUsers/home)
  - Click "Login" next to the user "Sam Rep (PR test)"
  - Open the Leads tab
  - Search "AI-TEST Convert" in the list search box and open the Lead
  - Click "Convert"
  - Keep "Create New" for Account and Opportunity and click "Convert"
  - Click the new Opportunity link
  expected:
  - The Account created is a Person Account named after the mover
  - The Opportunity has record type "Partner Referral", Stage "Qualification" and price book "Partner Referral Utilities"
- id: S05-TC-02
  title: The converted Opportunity has exactly the Lead's utilities as products
  section: S05 Lead conversion to a Partner Referral Opportunity with products
  tags:
  - story-05
  - regression
  preconditions:
  - S05-TC-01 has run
  steps:
  - Open Setup > Users (/lightning/setup/ManageUsers/home)
  - Click "Login" next to the user "Sam Rep (PR test)"
  - Open the Opportunities tab
  - Search "AI-TEST Convert" in the list search box and open the Opportunity
  - Open the "Products" related list
  expected:
  - 'Exactly two products are listed: Electricity and Internet'
  - Each has Quantity 1
- id: S05-TC-04
  title: A rep can delete a product that will not be connected before Utilities Connected
  section: S05 Lead conversion to a Partner Referral Opportunity with products
  tags:
  - story-05
  - regression
  preconditions:
  - S05-TC-02 has run
  steps:
  - Open Setup > Users (/lightning/setup/ManageUsers/home)
  - Click "Login" next to the user "Sam Rep (PR test)"
  - Open the Opportunities tab
  - Search "AI-TEST Convert" in the list search box and open the Opportunity
  - Open the "Products" related list
  - Delete the "Internet" product and confirm
  expected:
  - The product is deleted; only Electricity remains
