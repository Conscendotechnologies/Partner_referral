name: 002-partner-referral S07 Monthly payout batch and Xero CSV
context: 'Connectnow partner referral programme (feature 002) in the SDO org salesOrgSDO (a demo org, not a sandbox: every

  record a case creates starts with AI-TEST so it can be cleaned up).

  Partner portal: Experience Cloud site "Connectnow Partners" (https://co1778135180529.my.site.com/partners). Its home

  page holds the "Referrals this month" tiles, the commission tiles (principals only), the "Refer a mover" form and the

  referral tracker. Partner cases start as the admin and use "Log in to Experience as User" on the partner''s Contact.

  Internal app: "Connectnow Partner Referrals". Internal cases log in as a test user from Setup > Users.

  Personas:

  - Tom Nguyen: partner Agent, agency Harbour & Co Realty (Active).

  - Priya Shah: partner Principal, Harbour & Co Realty.

  - Chloe Tan: partner Agent, agency Bayside Property Group (Active).

  - Marco Rossi: partner Principal, Bayside Property Group.

  - Sam Rep (PR test): sales rep (PR_Sales_Rep), member of queues PR_NSW_ACT and PR_VIC_TAS.

  - Maya Manager (PR test): Partner Manager (PR_Partner_Manager + PR_Sales_Rep).

  - Fiona Finance (PR test): Finance (PR_Finance).

  Business terms: a referral (Referral__c, label "Referral") creates a Partner Referral Lead; converting it gives a

  Partner Referral Opportunity; at stage "Utilities Connected" a Partner Commission is created; Finance pays approved

  commissions monthly through a Payout Batch and the Xero CSV. Amounts are AUD ex GST.

  Assumptions (no story files in the repo; designed from the Jira acceptance criteria): UI labels were read from the

  org and the deployed components on 2026-11-18.

  '
cases:
- id: S07-TC-03
  title: Finance runs the payout on demand from the Payouts console
  section: S07 Monthly payout batch and Xero CSV
  tags:
  - story-07
  - smoke
  mode: both
  preconditions:
  - 'scripts/apex/pr-demo/9-qa-reset-commissions.apex then 7-qa-preconditions.apex have run (CI runs both first). Together they
    guarantee the run touches only test data: every Approved commission not yet in a batch is AI-TEST (the "AI-TEST
    Payout QA" one is seeded), and the suggested payout month has no batch, or only one made of AI-TEST commissions,
    which the reset removes. If either is not true, the reset prints "PR-QA S07: SKIP" and the S07 cases must not run
    in that org. The reset checks this once, before the run: it holds only if nobody else approves a commission in that
    org between the reset and the end of S07-TC-09 (a dedicated QA sandbox, or an agreed quiet window), for CI and
    manual runs alike'
  steps:
  - Open Setup > Users (/lightning/setup/ManageUsers/home)
  - Click "Login" next to the user "Fiona Finance (PR test)"
  - Open the "Payouts" tab in the Connectnow Partner Referrals app
  - Leave "Payout month" as suggested
  - Click "Run payout"
  - Wait 10 seconds and refresh the page
  expected:
  - A message "Payout for <month> is running. Refresh in a few seconds to see the lines." appears
  - After the refresh the batch for that month is listed with Status "Draft" and a Total ex GST
- id: S07-TC-04
  title: A user without Manage Partner Payouts cannot run, export or pay
  section: S07 Monthly payout batch and Xero CSV
  tags:
  - story-07
  - regression
  - security
  steps:
  - Open Setup > Users (/lightning/setup/ManageUsers/home)
  - Click "Login" next to the user "Maya Manager (PR test)"
  - Open the "Payouts" tab in the Connectnow Partner Referrals app
  expected:
  - '"Run payout", "Download Xero CSV" and "Mark paid" are disabled or not shown'
- id: S07-TC-07
  title: Download Xero CSV downloads the file and moves the batch to Exported
  section: S07 Monthly payout batch and Xero CSV
  tags:
  - story-07
  - smoke
  preconditions:
  - S07-TC-03 has run (a Draft batch with lines exists)
  steps:
  - Open Setup > Users (/lightning/setup/ManageUsers/home)
  - Click "Login" next to the user "Fiona Finance (PR test)"
  - Open the "Payouts" tab in the Connectnow Partner Referrals app
  - Click "Download Xero CSV" on the Draft batch
  expected:
  - A file named "connectnow-commissions-<YYYY-MM>.csv" downloads
  - The message "<file name> downloaded. Upload it to Xero, then mark the batch paid." appears
  - The batch Status is now "Exported"
- id: S07-TC-09
  title: Mark paid sets the batch and every commission in it to Paid
  section: S07 Monthly payout batch and Xero CSV
  tags:
  - story-07
  - smoke
  preconditions:
  - S07-TC-07 has run (the batch is Exported)
  steps:
  - Open Setup > Users (/lightning/setup/ManageUsers/home)
  - Click "Login" next to the user "Fiona Finance (PR test)"
  - Open the "Payouts" tab in the Connectnow Partner Referrals app
  - Click "Mark paid" on the Exported batch
  - Open the batch and one of its commissions
  expected:
  - The message "Batch marked paid. Every commission in it is now Paid." appears
  - The batch Status is "Paid" with today's paid date
  - The commission Status is "Paid"
