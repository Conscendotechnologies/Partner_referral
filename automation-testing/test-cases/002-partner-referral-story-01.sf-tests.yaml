name: 002-partner-referral S01 Partner agencies and partner users
context: 'Connectnow partner referral programme (feature 002) in the SDO org salesOrgSDO (a demo org, not a sandbox: every

  record a case creates starts with AI-TEST so it can be cleaned up).

  Partner portal: Experience Cloud site "Connectnow Partners" (https://co1778135180529.my.site.com/partners). Its home

  page holds the "Referrals this month" tiles, the commission tiles (principals only), the "Refer a mover" form and the

  referral tracker. Partner cases start as the admin and use "Log in to Experience as User" on the partner''s Contact.

  Internal app: "Connectnow Partner Referrals". Internal cases log in as a test user from Setup > Users.

  Personas:

  - Tom Nguyen: partner Agent, agency Harbour & Co Realty (Active).

  - Priya Shah: partner Principal, Harbour & Co Realty.

  - Chloe Tan: partner Agent, agency Bayside Property Group (Active).

  - Marco Rossi: partner Principal, Bayside Property Group.

  - Sam Rep (PR test): sales rep (PR_Sales_Rep), member of queues PR_NSW_ACT and PR_VIC_TAS.

  - Maya Manager (PR test): Partner Manager (PR_Partner_Manager + PR_Sales_Rep).

  - Fiona Finance (PR test): Finance (PR_Finance).

  Business terms: a referral (Referral__c, label "Referral") creates a Partner Referral Lead; converting it gives a

  Partner Referral Opportunity; at stage "Utilities Connected" a Partner Commission is created; Finance pays approved

  commissions monthly through a Payout Batch and the Xero CSV. Amounts are AUD ex GST.

  Assumptions (no story files in the repo; designed from the Jira acceptance criteria): UI labels were read from the

  org and the deployed components on 2026-11-18.

  '
cases:
- id: S01-TC-01
  title: A sales rep cannot change an agency's Partner Status
  section: S01 Partner agencies and partner users
  tags:
  - story-01
  - regression
  - validation-rule
  preconditions:
  - The agency Account "Harbour & Co Realty" exists with Partner Status "Active"
  steps:
  - Open Setup > Users (/lightning/setup/ManageUsers/home)
  - Click "Login" next to the user "Sam Rep (PR test)"
  - Open the Accounts tab
  - Search "Harbour & Co Realty" in the list search box and open the Account
  - Click "Edit"
  - Select "Inactive" in "Partner Status" if the field is editable
  - Click "Save"
  expected:
  - 'Partner Status cannot be changed: the field is missing or read-only on the edit form, or the save fails with "Only Partner
    Managers can change an agency''s partner status or commission rate."'
  - After closing the form the Account still shows Partner Status "Active"
- id: S01-TC-02
  title: A sales rep cannot change an agency's Commission Rate
  section: S01 Partner agencies and partner users
  tags:
  - story-01
  - regression
  - validation-rule
  steps:
  - Open Setup > Users (/lightning/setup/ManageUsers/home)
  - Click "Login" next to the user "Sam Rep (PR test)"
  - Open the Accounts tab
  - Search "Harbour & Co Realty" in the list search box and open the Account
  - Click "Edit"
  - Enter "65" in "Commission Rate" if the field is editable
  - Click "Save"
  expected:
  - 'Commission Rate cannot be changed: the field is missing or read-only on the edit form, or the save fails with "Only Partner
    Managers can change an agency''s partner status or commission rate."'
  - After closing the form the Account's Commission Rate is unchanged
- id: S01-TC-03
  title: A Partner Manager can change an agency's Commission Rate
  section: S01 Partner agencies and partner users
  tags:
  - story-01
  - smoke
  preconditions:
  - Note the current Commission Rate of "Bayside Property Group" and set it back after the case
  steps:
  - Open Setup > Users (/lightning/setup/ManageUsers/home)
  - Click "Login" next to the user "Maya Manager (PR test)"
  - Open the Accounts tab
  - Search "Bayside Property Group" in the list search box and open the Account
  - Click "Edit"
  - Enter "61" in "Commission Rate"
  - Click "Save"
  expected:
  - The Account is saved without an error
  - The detail page shows Commission Rate 61
- id: S01-TC-04
  title: An ABN with fewer than 11 digits is rejected
  section: S01 Partner agencies and partner users
  tags:
  - story-01
  - regression
  - validation-rule
  steps:
  - Open Setup > Users (/lightning/setup/ManageUsers/home)
  - Click "Login" next to the user "Maya Manager (PR test)"
  - Open the Accounts tab
  - Search "Bayside Property Group" in the list search box and open the Account
  - Click "Edit"
  - Enter "1234567890" in "ABN"
  - Click "Save"
  expected:
  - The Account is not saved
  - The error "ABN must be exactly 11 digits." is shown on the ABN field
- id: S01-TC-06
  title: A Commission Rate change appears in Account History with old value, new value, user and time
  section: S01 Partner agencies and partner users
  tags:
  - story-01
  - regression
  preconditions:
  - S01-TC-03 has run, so Bayside Property Group's Commission Rate was changed to 61
  steps:
  - Open Setup > Users (/lightning/setup/ManageUsers/home)
  - Click "Login" next to the user "Maya Manager (PR test)"
  - Open the Accounts tab
  - Search "Bayside Property Group" in the list search box and open the Account
  - Open "Account History" from the related list links at the top of the Account page
  expected:
  - A history row for "Commission Rate" shows the old value, the new value 61, the user "Maya Manager (PR test)" and the date
    and time of the change
